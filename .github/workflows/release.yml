name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: linux-x64
            # Older glibc baseline so the binary runs on more distros.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev

      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          BIN=target/${{ matrix.target }}/release/music-identifier
          NAME="music-identifier-${VERSION}-${{ matrix.name }}"
          mkdir -p dist
          case "${{ runner.os }}" in
            Windows)
              mkdir "$NAME"
              cp "$BIN.exe" README.md LICENSE "$NAME/"
              7z a "dist/$NAME.zip" "$NAME" > /dev/null
              ;;
            macOS)
              APP="Music Identifier.app"
              mkdir -p "$APP/Contents/MacOS"
              cp "$BIN" "$APP/Contents/MacOS/"
              sed "s/VERSION/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
              # Ad-hoc signature so the Screen Recording permission sticks to the app.
              codesign --force --deep -s - "$APP"
              mkdir "$NAME"
              mv "$APP" "$NAME/"
              cp README.md LICENSE "$NAME/"
              ditto -c -k --keepParent "$NAME" "dist/$NAME.zip"
              ;;
            Linux)
              mkdir "$NAME"
              cp "$BIN" README.md LICENSE "$NAME/"
              tar -czf "dist/$NAME.tar.gz" "$NAME"
              ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Music Identifier $GITHUB_REF_NAME" \
            --notes "$(cat <<'EOF'
          Recognise the song playing in any single window.

          ## Downloads
          | OS | File |
          |---|---|
          | Windows 10 (2004+) / 11 | `music-identifier-*-windows-x64.zip` |
          | macOS 13+ Apple Silicon | `music-identifier-*-macos-arm64.zip` |
          | macOS 13+ Intel | `music-identifier-*-macos-x64.zip` |
          | Linux x86_64 | `music-identifier-*-linux-x64.tar.gz` (needs `pulseaudio-utils`) |

          **macOS:** the app is not notarised. After unzipping, right-click → Open the first time
          (or run `xattr -dr com.apple.quarantine "Music Identifier.app"`), then allow
          Screen & System Audio Recording when prompted.

          **Windows:** SmartScreen may warn because the exe is unsigned. Choose "More info → Run anyway".
          EOF
          )"
